# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "fefc89faedc6db5b8ff2f6ac2b7a3c6a"
name = "Affiliate Swarm"
application_url = "https://affiliateswarm.ai"
embedded = true

[build]
include_config_on_deploy = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/shopify/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/shopify/webhooks/app-uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/shopify/webhooks/orders-paid"
  topics = [ "orders/paid" ]

[access.admin]
direct_api_mode = "offline"
embedded_app_direct_api_access = false

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]

[pos]
embedded = false
