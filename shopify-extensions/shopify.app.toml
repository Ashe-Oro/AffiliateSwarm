# Shopify CLI app config. Push changes with `shopify app deploy`
# (the legacy `shopify app config push` was removed in CLI 3.x).
# Auth follows the managed-install + token-exchange model — no manual
# OAuth routes needed in the Next.js backend.

name = "AffiliateSwarm"
client_id = "${SHOPIFY_API_KEY}"
application_url = "${SHOPIFY_APP_URL}/shopify/admin"
embedded = true

[access_scopes]
scopes = "read_orders,write_orders"
use_legacy_install_flow = false

[access.admin]
direct_api_mode = "offline"
embedded_app_direct_api_access = false

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = ["orders/paid"]
uri = "${SHOPIFY_APP_URL}/shopify/webhooks/orders-paid"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "${SHOPIFY_APP_URL}/shopify/webhooks/app-uninstalled"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "${SHOPIFY_APP_URL}/shopify/webhooks/compliance"

[pos]
embedded = false

[build]
include_config_on_deploy = true
