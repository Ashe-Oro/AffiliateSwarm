name: Claude Code

# ---------------------------------------------------------------
# On-demand Claude Code runs.
#
# Mention `@claude` in a PR comment, PR review, issue, or issue
# comment and Claude responds in that thread — answering questions,
# reviewing code, or pushing changes as instructed.
#
# Setup: add a `CLAUDE_CODE_OAUTH_TOKEN` repository secret
# (Settings -> Secrets and variables -> Actions). Generate the
# token by running `claude setup-token` in a local Claude Code
# session, or via the Claude GitHub App install flow.
# ---------------------------------------------------------------

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only run when `@claude` is actually mentioned.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
