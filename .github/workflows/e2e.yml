name: E2E Tests (Playwright)

# ---------------------------------------------------------------
# Runs the fast Playwright E2E suite (full-lifecycle.spec.ts)
# which uses direct deposits — no Stripe keys needed.
#
# The test exercises the entire platform across all three roles:
#   1.  Advertiser registration, email verification, identity
#   2.  Campaign creation, escrow funding, tracking setup, activation
#   3.  Affiliate registration with full profile
#   4.  Campaign discovery, application, profile visibility
#   5.  Click tracking (redirect + ref), postback conversion, idempotency
#   6.  Wallet balances, escrow deductions, lead lists, analytics KPIs
#   7.  Affiliate payout (PLATFORM_CREDIT instant, CRYPTO pending)
#   8.  Error handling (bad auth, 404s, invalid payloads, business rules)
#   9.  Advertiser browser dashboard (campaigns, leads, conversions, analytics)
#   10. Affiliate browser dashboard (campaigns, earnings, wallet, reputation)
#   11. Admin browser dashboard (overview, agents, payments)
#
# Triggers:
#   1. PRs that touch meaningful code (path filters below)
#   2. Manual dispatch via `gh workflow run e2e`
#   3. Push to master (post-merge verification)
# ---------------------------------------------------------------

on:
  pull_request:
    branches: [master]
    paths:
      # API routes and business logic
      - "src/app/api/**"
      - "src/services/**"
      - "src/lib/**"
      # Database schema
      - "prisma/**"
      # Dashboard UI pages and components
      - "src/app/dashboard/**"
      - "src/app/affiliate/**"
      - "src/app/admin/**"
      - "src/components/**"
      # Auth and middleware
      - "src/app/login/**"
      - "proxy.ts"
      - "middleware.ts"
      # The E2E tests themselves
      - "tests/e2e/**"
      - "playwright.config.ts"
      # Dependencies
      - "package.json"
      - "package-lock.json"

  push:
    branches: [master]
    paths:
      - "src/**"
      - "prisma/**"
      - "tests/e2e/**"

  workflow_dispatch:
    inputs:
      test_file:
        description: "Specific test file to run (blank = full-lifecycle only)"
        required: false
        default: ""

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: affiliateswarm
          POSTGRES_PASSWORD: affiliateswarm_dev
          POSTGRES_DB: affiliateswarm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U affiliateswarm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://affiliateswarm:affiliateswarm_dev@localhost:5432/affiliateswarm?schema=public

      - name: Run E2E tests
        run: |
          if [ -n "${{ github.event.inputs.test_file }}" ]; then
            npx playwright test "${{ github.event.inputs.test_file }}"
          else
            npx playwright test tests/e2e/full-lifecycle.spec.ts
          fi
        env:
          DATABASE_URL: postgresql://affiliateswarm:affiliateswarm_dev@localhost:5432/affiliateswarm?schema=public
          REDIS_URL: redis://localhost:6379
          BASE_URL: http://localhost:3099
          NEXT_PUBLIC_APP_URL: http://localhost:3099
          NEXT_PUBLIC_SHORT_URL: http://localhost:3099
          NODE_ENV: test
          HMAC_ENCRYPTION_KEY: test-hmac-key-for-ci-0000000000000
          PLATFORM_HD_SEED: test test test test test test test test test test test junk
          ADMIN_SECRET: test-admin-secret-for-ci-00000000
          CRON_SECRET: test-cron-secret-for-ci-000000000
          # Feature flags that gate pages exercised by full-lifecycle.spec.ts.
          # Off-by-default in the app so real deployments can roll them out
          # deliberately, but tests cover the rendered state and need them on.
          ENABLE_AFFILIATE_REPUTATION_TAB: "true"
          ENABLE_AFFILIATE_REFERRALS_TAB: "true"

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload trace files
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
